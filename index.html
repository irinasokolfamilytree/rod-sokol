async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(S),iterations:IT,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(CT));
  const o=JSON.parse(new TextDecoder().decode(pt));
  return ()=>{ window.__MAN=o.man; window.__KEY=key; document.open(); document.write(o.html); document.close(); };
}
