async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(S),iterations:IT,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(CT));
  const o=JSON.parse(new TextDecoder().decode(pt));
  return ()=>{ window.__MAN=o.man; window.__KEY=key; document.open(); document.write(o.html); document.close(); };
}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;const er=document.getElementById('e');er.textContent='Открываю…';
  let go;try{go=await open_(pw)}catch(x){er.textContent='Неверный пароль, попробуйте ещё раз.';return}
  try{if(document.getElementById('rem').checked)localStorage.setItem('rodpw',pw)}catch(x){} go();};
try{const s=localStorage.getItem('rodpw');if(s)open_(s).then(go=>go()).catch(()=>{try{localStorage.removeItem('rodpw')}catch(x){}})}catch(x){}
